version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: clean-arch-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clean-arch-app
    restart: always
    ports:
      - "8080:8080"   # REST API
      - "50051:50051" # gRPC
      - "8081:8081"   # GraphQL
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: orders
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
